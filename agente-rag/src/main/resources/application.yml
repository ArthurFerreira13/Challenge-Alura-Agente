spring:
  application:
    name: agente-rag
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_TNS_ALIAS:agenterag_high}?TNS_ADMIN=${TNS_ADMIN:/opt/oracle/wallet}
    username: ${ORACLE_DB_USER:agente_rag}
    password: ${ORACLE_DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

# Configuração do provedor de embeddings / chat (LangChain4j)
langchain4j:
  open-ai:
    api-key: ${OPENAI_API_KEY:}
    chat-model: gpt-4o-mini
    embedding-model: text-embedding-3-small

agente-rag:
  ingestao:
    diretorio-documentos: classpath:documentos/
  rag:
    max-resultados: 5
    limiar-similaridade: 0.7
